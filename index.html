<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulador N64 Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* <-- Soluciona el problema de la altura en móviles */
            background: #000;
            overflow: hidden;
        }
        #emulator-container {
            width: 100vw;
            height: 100%;
            height: 100dvh; /* <-- Se adapta al tamaño real de la pantalla */
        }
    </style>
</head>
<body>
    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'n64';
        EJS_gameUrl = 'mak.z64'; // Recuerda poner el nombre exacto de tu ROM
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
